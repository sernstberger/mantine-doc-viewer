name: Feature request
description: Propose a new prop, part or capability
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do that you cannot do now?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How it would look in code, following Mantine's conventions where possible
