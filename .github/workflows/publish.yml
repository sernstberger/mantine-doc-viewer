name: Publish package

# The release pull request ("[release] Version: X", opened by `npm run release:*`) changes
# package/package.json; when it merges, this publishes X to npm after the `release` approval,
# then deploys the docs (not for prereleases) and creates the GitHub release. A manual run does
# the same for the version on main, and finishes one that is already on npm (the first release,
# published by hand with `npm run publish:bootstrap`) from the commit npm recorded for it. Every
# step checks npm or GitHub first, so re-running a failed run is the recovery.
# Only `test` installs and builds; the job that can publish runs no dependency code
on:
  push:
    branches:
      - main
    paths:
      - package/package.json
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.plan.outputs.name }}
      version: ${{ steps.plan.outputs.version }}
      decision: ${{ steps.plan.outputs.decision }}
      publish: ${{ steps.plan.outputs.publish }}
      finish: ${{ steps.plan.outputs.finish }}
      docs: ${{ steps.plan.outputs.docs }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      node: ${{ steps.plan.outputs.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'
      - name: Install dependencies
        run: yarn install --immutable
      - name: Compare the version with npm
        id: plan
        run: npx tsx scripts/publish --plan
      - name: First release
        if: steps.plan.outputs.decision == 'skip-not-on-registry'
        run: echo "::warning title=First release::The package is not on npm yet. Publish it by hand from main with npm run publish:bootstrap, then run this workflow again."
      - name: Release notes from the CHANGELOG
        if: steps.plan.outputs.finish == 'true'
        run: npx tsx scripts/publish --notes "$RUNNER_TEMP/release-notes.md"
      - name: Upload release notes
        if: steps.plan.outputs.finish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  test:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build package
        run: npm run build
      - name: Check package exports
        run: npm run check:exports
      - name: Build docs
        run: npm run docs:build
      - name: Run tests
        run: npm test
      - name: Pack the tarball to publish
        run: npx tsx scripts/publish --pack "$RUNNER_TEMP/tarball"
      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: ${{ runner.temp }}/tarball/*.tgz
          if-no-files-found: error

  publish:
    needs: [prepare, test]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ needs.prepare.outputs.node }}
          package-manager-cache: false
      - name: Upgrade npm for trusted publishing (needs >= 11.5.1)
        run: npm install -g npm@11.21.2
      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: ${{ runner.temp }}/tarball
      - name: Publish
        env:
          NAME: ${{ needs.prepare.outputs.name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -n "$(npm view "$NAME@$VERSION" version 2> /dev/null || true)" ]; then
            echo "$NAME@$VERSION is already on npm"
            exit 0
          fi
          npm publish "$RUNNER_TEMP"/tarball/*.tgz --access public --tag "$TAG" --provenance

  docs:
    needs: [prepare, publish]
    if: >-
      !cancelled() && needs.prepare.outputs.docs == 'true' &&
      (needs.publish.result == 'success' || needs.prepare.outputs.publish == 'false')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-docs.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  release:
    needs: [prepare, publish, docs]
    if: >-
      !cancelled() && needs.prepare.outputs.finish == 'true' &&
      (needs.publish.result == 'success' || needs.prepare.outputs.publish == 'false') &&
      (needs.docs.result == 'success' || needs.prepare.outputs.docs == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ needs.prepare.outputs.sha }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 0
          fi
          FLAGS=(--title "$VERSION" --target "$TARGET" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$VERSION" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$VERSION" "${FLAGS[@]}"
